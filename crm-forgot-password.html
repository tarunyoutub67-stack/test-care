<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - CureAndCare</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .reset-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { color: #00a2ed; font-weight: 800; margin-bottom: 10px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; outline: none; font-family: inherit; font-size: 14px; }
        input:focus { border-color: #00a2ed; }
        button { width: 100%; padding: 14px; background: #00a2ed; color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { background: #008ecc; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="reset-card">
        <h2>Reset Password</h2>
        <p id="msg">Enter your username to receive a 6-digit verification code on your registered email.</p>

        <div id="step1">
            <input type="text" id="resetUser" placeholder="Enter Username (e.g. admin or staff name)">
            <button id="sendBtn" onclick="sendOTP()">Send Reset Code</button>
        </div>

        <div id="step2" class="hidden">
            <input type="text" id="inputOTP" placeholder="Enter 6-Digit OTP Code" autocomplete="off">
            <button onclick="verifyOTP()">Verify Code</button>
        </div>

        <div id="step3" class="hidden">
            <input type="password" id="newPass" placeholder="Enter New Password">
            <button id="updateBtn" onclick="updatePassword()">Update Password</button>
        </div>

        <div style="margin-top:25px; text-align:center;">
            <a href="crm-login.html" style="color:#64748b; font-size:13px; text-decoration:none; font-weight: 600;">Back to Login Page</a>
        </div>
    </div>

    <script>
        emailjs.init("wLfY3tCPBLZBuNMkx"); // Aapka EmailJS ID
        const firebaseConfig = { apiKey: "AIzaSyC-Ito4dNRQ45IjIOWL63Hqk9sKzbvKe-M", databaseURL: "https://cureandcare-crm-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let generatedOTP = "";
        let targetUser = "";

        async function sendOTP() {
            targetUser = document.getElementById('resetUser').value.trim().toLowerCase();
            if(!targetUser) return alert("Please enter your username!");

            const btn = document.getElementById('sendBtn');
            btn.innerHTML = 'Sending...';
            btn.disabled = true;

            let userEmail = "";

            // 🚀 100% FIXED ADMIN LOGIC: Hamesha aapki email par jayega
            if (targetUser === 'admin') {
                userEmail = 'starunsharma67@gmail.com';
            } 
            else {
                // Baaki staff/manager ke liye database check karega
                try {
                    const snapshot = await database.ref('users/' + targetUser).once('value');
                    if(!snapshot.exists()) {
                        btn.innerHTML = 'Send Reset Code'; btn.disabled = false;
                        return alert("Username not found in the system!");
                    }
                    userEmail = snapshot.val().email;
                } catch(error) {
                    btn.innerHTML = 'Send Reset Code'; btn.disabled = false;
                    return alert("Database Error. Please try again.");
                }
            }

            if(!userEmail) {
                btn.innerHTML = 'Send Reset Code'; btn.disabled = false;
                return alert("No email is registered for this user. Please contact the Admin.");
            }

            // Generate 6 Digit Code
            generatedOTP = Math.floor(100000 + Math.random() * 900000); 

            // 🚀 English Email Message Sent via EmailJS
            emailjs.send("service_adqy43h", "template_gb0v9d9", {
                to_email: userEmail,
                message: `Your CureAndCare CRM password reset code is: ${generatedOTP}`,
                to_name: targetUser === 'admin' ? 'Tarun Sharma' : targetUser
            }).then(() => {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                
                // Hide exact email for security (e.g., st***@gmail.com)
                let splitEmail = userEmail.split("@");
                let hiddenEmail = splitEmail[0].substring(0,2) + "***@" + splitEmail[1];
                document.getElementById('msg').innerText = `Verification code has been sent to ${hiddenEmail}`;
            }).catch(err => {
                alert("Failed to send email. Please check your EmailJS settings.");
                btn.innerHTML = 'Send Reset Code';
                btn.disabled = false;
            });
        }

        function verifyOTP() {
            const enteredCode = document.getElementById('inputOTP').value.trim();
            if(!enteredCode) return alert("Please enter the OTP.");

            if(enteredCode == generatedOTP) {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                document.getElementById('msg').innerText = "Verification successful! Enter your new password below.";
            } else {
                alert("Invalid OTP code! Please try again.");
            }
        }

        function updatePassword() {
            let newPass = document.getElementById('newPass').value.trim();
            if(newPass.length < 4) return alert("Password must be at least 4 characters long.");

            const btn = document.getElementById('updateBtn');
            btn.innerHTML = 'Updating...';
            btn.disabled = true;

            // Update password in Firebase
            database.ref('users/' + targetUser).update({ password: newPass }).then(() => {
                // Agar pehli baar admin set ho raha hai aur role wagarah nahi hai, to safely create kar dega
                if(targetUser === 'admin') {
                    database.ref('users/admin').update({ role: 'admin', name: 'System Admin' });
                }
                
                alert("Password updated successfully! ✅ You can now login.");
                window.location.href = "crm-login.html";
            }).catch(error => {
                alert("Error updating password: " + error.message);
                btn.innerHTML = 'Update Password';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
