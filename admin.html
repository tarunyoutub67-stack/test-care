    <meta charset="UTF-8">
    <title>CureAndCare CRM - Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #00a2ed; --primary-dark: #008ecc; --bg: #f8fafc; --border: #e2e8f0; --text-main: #1e293b; --text-light: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }

        .sidebar { width: 260px; background: #ffffff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; }
        .logo-area { padding: 20px; border-bottom: 1px solid var(--border); }
        .logo-area h2 { color: var(--primary); font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .nav-menu { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-light); font-weight: 600; font-size: 13px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 5px; text-decoration: none; }
        .nav-item:hover { background: #f1f5f9; color: var(--text-main); }
        .nav-item.active { background: rgba(0,162,237,0.1); color: var(--primary); border-left: 4px solid var(--primary); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { height: 65px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; flex-shrink: 0; }
        .page-title { font-size: 18px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        
        .cloud-badge { font-size: 11px; background: #d1fae5; color: #059669; padding: 4px 8px; border-radius: 5px; border: 1px solid #10b981; }

        .live-clocks { display: flex; gap: 12px; }
        .clock-badge { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #334155; display: flex; align-items: center; gap: 5px; }
        .clock-badge span { color: var(--primary-dark); font-weight: 800; font-variant-numeric: tabular-nums; }

        .user-profile { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 13px; color: var(--text-main); }

        .app-section { padding: 20px; overflow-y: auto; flex: 1; display: none; }
        .app-section.active { display: block; }

        .toolbar { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
        .select-input { padding: 9px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; outline: none; }
        
        .excel-table { width: 100%; border-collapse: collapse; min-width: 1200px; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .excel-table th { background: var(--primary); color: white; padding: 14px 10px; border: 1px solid var(--primary-dark); font-size: 11px; position: sticky; top: 0; z-index: 10; min-width: 170px; }
        .excel-table td { border: 1px solid #e2e8f0; vertical-align: top; padding: 12px 10px; }
        
        .t-label { font-size: 9px; color: #94a3b8; font-weight: 800; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
        .time-flex { display: flex; gap: 6px; margin-bottom: 8px; }
        .t-hr, .t-hr2 { flex: 2; padding: 6px 4px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 600; outline: none; background: #fff; }
        .t-ampm, .t-ampm2 { flex: 1; padding: 6px 2px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 700; background: #f8fafc; text-align: center; }
        
        .divider { border-top: 1px dashed #cbd5e1; margin: 8px 0; }
        
        .staff-select, .task-select { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 700; outline: none; cursor: pointer; margin-bottom: 8px; }
        .staff-select { background: #f0f9ff; color: #008ecc; border-color: #00a2ed; }
        .task-select { background: #fff; color: #475569; }

        .btn { padding: 9px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .btn-save { background: #6366f1; color: white; }
        .btn-excel { background: #3b82f6; color: white; }
        .btn-publish { background: #10b981; color: white; }
        .btn-invoice { background: #f59e0b; color: white; }

        /* Invoice Styles */
        .invoice-card { background: #fff; padding: 30px; border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto; }
        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .inv-table th { background: #f1f5f9; padding: 12px; text-align: left; border-bottom: 2px solid #cbd5e1; font-size: 12px; color: #334155; }
        .inv-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; font-weight: 500; }
        .total-row { background: #f8fafc; font-weight: 800; color: var(--primary-dark); }
        .rate-input { width: 80px; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area"><h2><i class="fas fa-heartbeat"></i> CureAndCare</h2></div>
        <div class="nav-menu">
            <a class="nav-item"><i class="fas fa-home"></i> Home</a>

                <button onclick="localStorage.clear(); window.location.replace('crm-login.html');" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:700; font-size:11px; margin-left:10px;">Logout</button>

        <div id="rosterSection" class="app-section active">

                    <select id="locationSelect" class="select-input" onchange="buildGrid()" style="width:320px;">

                    <button class="btn btn-save" id="saveBtn" onclick="saveRoster()"><i class="fas fa-save"></i> Save Roster</button>

            <div style="overflow-x: auto; max-width: 100%; margin: 0 auto; border-radius: 10px;">

                    <tbody id="rosterGrid"></tbody>
                </table>
            </div>
        </div>

        <div id="invoiceSection" class="app-section">
            <div class="toolbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <select id="invLocationSelect" class="select-input" style="width:320px;">
                        <option>27 Clearview Crescent Orange NSW 2800</option>
                        <option>27A Clearview Crescent Orange NSW 2800</option>
                        <option>7 Gilroy Place Orange NSW 2800</option>
                    </select>
                    <input type="date" id="invStartDate" value="2026-05-11" class="select-input">
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-invoice" onclick="generateInvoice()"><i class="fas fa-sync-alt"></i> Load Data & Generate</button>
                    <button class="btn btn-publish" onclick="window.print()"><i class="fas fa-print"></i> Print Invoice</button>
                </div>
            </div>

            <div class="invoice-card" id="invoiceCard" style="display:none;">
                <div class="invoice-header">
                    <div>
                        <h2 style="color:var(--primary); font-weight:800; font-size:24px;">CureAndCare</h2>
                        <p style="color:#64748b; font-size:12px; margin-top:5px;">Shift Billing & Invoice Statement</p>
                    </div>
                    <div style="text-align:right;">
                        <h3 style="color:#1e293b; font-size:18px;">INVOICE</h3>
                        <p style="color:#64748b; font-size:12px; margin-top:5px;" id="invLocText"></p>
                        <p style="color:#64748b; font-size:12px;" id="invDateText"></p>
                    </div>
                </div>

                <table class="inv-table">
                    <thead>
                        <tr>
                            <th>Staff Name</th>
                            <th style="text-align:center;">Total Shifts</th>
                            <th style="text-align:center;">Total Hours</th>
                            <th style="text-align:center;">Hourly Rate ($)</th>
                            <th style="text-align:right;">Total Amount ($)</th>

                        </tbody>

    <script>
        // 🚀 FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC-Ito4dNRQ45IjIOWL63Hqk9sKzbvKe-M",
            authDomain: "cureandcare-crm.firebaseapp.com",
            databaseURL: "https://cureandcare-crm-default-rtdb.firebaseio.com",
            projectId: "cureandcare-crm",
            storageBucket: "cureandcare-crm.firebasestorage.app",
            messagingSenderId: "294207622967",
            appId: "1:294207622967:web:59846c2cf1b463cb21d4b2"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 🚀 EMAILJS VARIABLES
        const SERVICE_ID = "service_adqy43h";
        const TEMPLATE_ID = "template_gb0v9d9"; 
        const TEST_EMAILS = [ "puja851021@gmail.com", "starunsharma67@gmail.com", "starun64@gmail.com", "ayushsydney@gmail.com", "sharma.meenu84@gmail.com" ];
        
        const STAFF_LIST = ["None", "Ankit", "Bubble", "Rene", "Titus", "Marcelo", "Nitesh"];
        const TASK_LIST = ["Select Task", "1:1 Support", "Community Participation", "Sleepover", "Awake Night"];
        const HR_OPTIONS = ["Select", "12:00", "01:00", "02:00", "03:00", "04:00", "05:00", "06:00", "07:00", "08:00", "09:00", "10:00", "11:00", "Sleepover", "Leave", "Sick", "Training"];

        // 🚀 TAB SWITCHER LOGIC
        function switchTab(sectionId, element) {
            document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            element.classList.add('active');

            if(sectionId === 'invoiceSection') document.getElementById('headerTitle').innerText = 'Generate Invoice';
            else document.getElementById('headerTitle').innerText = 'Shift Roster Management';
        }

        // 🚀 CLOCK
        function updateLiveClocks() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('timeIND').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'Asia/Kolkata' }).format(now);
            document.getElementById('timeAUS').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'Australia/Sydney' }).format(now);
        }
        setInterval(updateLiveClocks, 1000);

        // ==================== ROSTER LOGIC ====================
        function buildGrid() {
            const loc = document.getElementById('locationSelect').value;
            const start = new Date(document.getElementById('rosterStartDate').value);
            const grid = document.getElementById('rosterGrid');
            const header = document.getElementById('rosterHeader');

            let columns = [];
            if(loc.includes("27A")) columns = ["Shift 1", "Shift 2", "Craig Calleja (Home Support)"];
            else columns = ["Shift 1", "Shift 2", "Shift 3", "Mitch (1:1)", "Steve's Home alone hours"];

            header.innerHTML = `<tr><th width="120">Date / Day</th>${columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
            grid.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:40px; font-weight:bold; color:#00a2ed;"><i class="fas fa-spinner fa-spin"></i> Fetching Live Roster from Cloud...</td></tr>';

            const uniqueKey = "Roster_" + loc.replace(/[.#$\[\] ]/g, '_') + "_" + document.getElementById('rosterStartDate').value;

            database.ref('rosters/' + uniqueKey).get().then((snapshot) => {
                let savedData = snapshot.exists() ? snapshot.val() : [];
                grid.innerHTML = '';
                
                for(let i=0; i<14; i++) {
                    let d = new Date(start); d.setDate(start.getDate() + i);
                    let row = `<tr>
                        <td style="background:#f8fafc; text-align:center; vertical-align:middle; min-width:90px;">
                            <b style="font-size:14px; color:#1e293b;">${d.getDate()}-${d.toLocaleString('default',{month:'short'})}</b><br>
                            <span style="color:#64748b; font-weight:600;">${d.toLocaleDateString('en-US',{weekday:'long'})}</span>
                        </td>
                        ${columns.map((val, cellIndex) => {
                            let s = savedData && savedData[i] && savedData[i][cellIndex] ? savedData[i][cellIndex] : {};
                            let currentTasks = [...TASK_LIST];
                            if (val === "Shift 3" || val === "Mitch (1:1)") currentTasks.push("Specialist Appointment");

                            return `<td>
                                <div class="t-label">Start Time</div>
                                <div class="time-flex"><select class="t-hr">${HR_OPTIONS.map(h => `<option ${h === (s.hr1 || 'Select') ? 'selected' : ''}>${h}</option>`).join('')}</select>
                                <select class="t-ampm"><option ${s.ampm1 === 'AM' ? 'selected' : ''}>AM</option><option ${s.ampm1 === 'PM' ? 'selected' : ''}>PM</option></select></div>
                                <div class="t-label">End Time</div>
                                <div class="time-flex"><select class="t-hr2">${HR_OPTIONS.map(h => `<option ${h === (s.hr2 || 'Select') ? 'selected' : ''}>${h}</option>`).join('')}</select>
                                <select class="t-ampm2"><option ${s.ampm2 === 'AM' ? 'selected' : ''}>AM</option><option ${s.ampm2 === 'PM' ? 'selected' : ''}>PM</option></select></div>
                                <div class="divider"></div>
                                <div class="t-label">Assign Staff</div>
                                <select class="staff-select">${STAFF_LIST.map(n => `<option ${n === (s.staff || 'None') ? 'selected' : ''}>${n}</option>`).join('')}</select>
                                <div class="t-label">Assign Task</div>
                                <select class="task-select">${currentTasks.map(t => `<option ${t === (s.task || 'Select Task') ? 'selected' : ''}>${t}</option>`).join('')}</select>
                            </td>`;
                        }).join('')}
                    </tr>`;
                    grid.innerHTML += row;
                }
            });
        }

        function saveRoster() {
            const btn = document.getElementById('saveBtn');
            const loc = document.getElementById('locationSelect').value;
            const date = document.getElementById('rosterStartDate').value;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            let data = [];
            document.querySelectorAll('#rosterGrid tr').forEach(row => {
                let rowData = [];
                row.querySelectorAll('td').forEach((td, idx) => { 
                    if(idx > 0) {
                        rowData.push({ 
                            hr1: td.querySelector('.t-hr').value, ampm1: td.querySelector('.t-ampm').value,
                            hr2: td.querySelector('.t-hr2').value, ampm2: td.querySelector('.t-ampm2').value,
                            staff: td.querySelector('.staff-select').value,
                            task: td.querySelector('.task-select').value 
                        });
                    }
                });
                data.push(rowData);
            });

            const uniqueKey = "Roster_" + loc.replace(/[.#$\[\] ]/g, '_') + "_" + date;
            database.ref('rosters/' + uniqueKey).set(data).then(() => {
                alert("Success: Shift Roster is now updated and live! ✅");
            }).finally(() => {
                btn.innerHTML = '<i class="fas fa-save"></i> Save Roster';
                btn.disabled = false;
            });
        }

        // ==================== INVOICE LOGIC ====================
        // Helper: Convert "07:00 AM" to decimal hours (e.g., 7.0)
        function parseTime(timeStr, ampm) {
            if(!timeStr || timeStr === "Select" || timeStr === "Sleepover" || timeStr === "Leave" || timeStr === "Sick") return null;
            let parts = timeStr.split(':');
            let h = parseInt(parts[0]);
            let m = parseInt(parts[1]) / 60;
            if (ampm === "PM" && h !== 12) h += 12;
            if (ampm === "AM" && h === 12) h = 0;
            return h + m;
        }

        function generateInvoice() {
            const loc = document.getElementById('invLocationSelect').value;
            const date = document.getElementById('invStartDate').value;
            const uniqueKey = "Roster_" + loc.replace(/[.#$\[\] ]/g, '_') + "_" + date;
            
            document.getElementById('invLocText').innerText = "Loc: " + loc;
            document.getElementById('invDateText').innerText = "Roster Start: " + date;

            database.ref('rosters/' + uniqueKey).get().then((snapshot) => {
                if (!snapshot.exists()) {
                    alert("No roster data found for this location and date. Please save roster first!");
                    return;
                }
                
                let data = snapshot.val();
                let staffStats = {}; // To store hours and shift count per staff

                // Loop through 14 days and all columns to calculate hours
                data.forEach(dayRow => {
                    dayRow.forEach(cell => {
                        if(cell.staff && cell.staff !== "None") {
                            let staffName = cell.staff;
                            if(!staffStats[staffName]) staffStats[staffName] = { shifts: 0, hours: 0 };
                            
                            staffStats[staffName].shifts += 1;

                            // Calculate Hours
                            if(cell.hr1 === "Sleepover" || cell.hr2 === "Sleepover") {
                                staffStats[staffName].hours += 8; // Flat 8 hours for sleepover
                            } else {
                                let t1 = parseTime(cell.hr1, cell.ampm1);
                                let t2 = parseTime(cell.hr2, cell.ampm2);
                                if(t1 !== null && t2 !== null) {
                                    let duration = t2 - t1;
                                    if(duration < 0) duration += 24; // Handled Overnight Shift
                                    staffStats[staffName].hours += duration;
                                }
                            }
                        }
                    });
                });

                // Render Invoice Table
                const tbody = document.getElementById('invoiceTableBody');
                tbody.innerHTML = '';
                
                let defaultRate = 35; // Standard $35/hr

                Object.keys(staffStats).forEach(name => {
                    let stats = staffStats[name];
                    let totalHrs = stats.hours.toFixed(2);
                    let initialTotal = (stats.hours * defaultRate).toFixed(2);
                    
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${name}</strong></td>
                        <td style="text-align:center;">${stats.shifts}</td>
                        <td style="text-align:center;">${totalHrs} hrs</td>
                        <td style="text-align:center;">
                            $ <input type="number" class="rate-input" value="${defaultRate}" onchange="updateTotal(this, ${stats.hours})">
                        </td>
                        <td style="text-align:right; font-weight:700; color:var(--primary-dark);" class="row-total">$ ${initialTotal}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('invoiceCard').style.display = 'block';
            });
        }

        // Auto update total when rate is changed
        function updateTotal(inputElement, hours) {
            let newRate = parseFloat(inputElement.value) || 0;
            let newTotal = (newRate * hours).toFixed(2);
            inputElement.parentElement.nextElementSibling.innerText = "$ " + newTotal;
        }

        // ==================== INIT ====================
        window.onload = function() {
            buildGrid();
            updateLiveClocks();
        };
    </script>

    <style>
        @media print {
            .sidebar, .top-header, .toolbar { display: none !important; }
            .main-content { padding: 0 !important; overflow: visible !important; }
            .invoice-card { border: none; box-shadow: none; margin: 0; padding: 0; }
        }
    </style>
</body>
