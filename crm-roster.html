<head>

    <meta charset="UTF-8">
    <title>CureAndCare CRM - Live Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #00a2ed; --primary-dark: #008ecc; --bg: #f8fafc; --border: #e2e8f0; --text-main: #1e293b; --text-light: #64748b; --holiday-red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }

        .sidebar { width: 260px; background: #ffffff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; }
        .logo-area { padding: 20px; border-bottom: 1px solid var(--border); }
        .logo-area h2 { color: var(--primary); font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .nav-menu { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-light); font-weight: 600; font-size: 13px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 5px; text-decoration: none; }
        .nav-item:hover { background: #f1f5f9; color: var(--text-main); }
        .nav-item.active { background: rgba(0,162,237,0.1); color: var(--primary); border-left: 4px solid var(--primary); }
        
        .nav-item .caret { margin-left: auto; transition: transform 0.3s; }
        .nav-item.open .caret { transform: rotate(180deg); }
        .dropdown-container { display: none; padding-left: 15px; margin-bottom: 10px; border-left: 2px solid #e2e8f0; margin-left: 20px; }
        .dropdown-container.open { display: block; }
        .dropdown-container .nav-item { padding: 10px 15px; font-size: 12px; margin-bottom: 2px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { height: 65px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; flex-shrink: 0; }
        .page-title { font-size: 18px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        
        .cloud-badge { font-size: 11px; background: #d1fae5; color: #059669; padding: 4px 8px; border-radius: 5px; border: 1px solid #10b981; }

        .live-clocks { display: flex; gap: 12px; }
        .clock-badge { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #334155; display: flex; align-items: center; gap: 5px; }
        .clock-badge span { color: var(--primary-dark); font-weight: 800; font-variant-numeric: tabular-nums; }

        .user-profile { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 13px; color: var(--text-main); }

        .roster-view { padding: 20px; overflow-y: auto; flex: 1; }
        .toolbar { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
        .select-input { padding: 9px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; outline: none; }
        
        .excel-table { width: 100%; border-collapse: collapse; min-width: 1200px; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .excel-table th { background: var(--primary); color: white; padding: 14px 10px; border: 1px solid var(--primary-dark); font-size: 11px; position: sticky; top: 0; z-index: 10; min-width: 170px; }
        .excel-table td { border: 1px solid #e2e8f0; vertical-align: top; padding: 12px 10px; }
        
        .roster-holiday-row { background-color: #fff1f2 !important; }
        .roster-holiday-row td { border-top: 2px solid #fecdd3 !important; border-bottom: 2px solid #fecdd3 !important; }
        .holiday-alert-tag { 
            background: var(--holiday-red); 
            color: white; 
            font-size: 10px; 
            font-weight: 800; 
            padding: 6px 8px; 
            border-radius: 6px; 
            display: block; 
            margin-top: 8px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3); 
        }

        .t-label { font-size: 9px; color: #94a3b8; font-weight: 800; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
        .time-flex { display: flex; gap: 6px; margin-bottom: 8px; }
        .t-hr, .t-hr2 { flex: 2; padding: 6px 4px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 600; outline: none; background: #fff; }
        .t-ampm, .t-ampm2 { flex: 1; padding: 6px 2px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 700; background: #f8fafc; text-align: center; }
        
        .divider { border-top: 1px dashed #cbd5e1; margin: 8px 0; }
        
        .staff-select, .task-select { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 700; outline: none; cursor: pointer; margin-bottom: 8px; }
        .staff-select { background: #f0f9ff; color: #008ecc; border-color: #00a2ed; }
        .task-select { background: #fff; color: #475569; }

        .btn { padding: 9px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .btn-save { background: #6366f1; color: white; }
        .btn-excel { background: #3b82f6; color: white; }
        .btn-publish { background: #10b981; color: white; }

        .staff-view-only select { pointer-events: none; background-color: #f8fafc !important; color: #64748b !important; border-color: #e2e8f0 !important; -moz-appearance: none; -webkit-appearance: none; appearance: none; }

        .crm-footer { background: #fff; padding: 12px 20px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-light); border-top: 1px solid var(--border); flex-shrink: 0; }
        .crm-footer span { color: var(--primary); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-box { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-btn { padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; flex: 1; transition: 0.2s; }
        .btn-yes { background: #10b981; color: white; }
        .btn-yes:hover { background: #059669; }
        .btn-no { background: #ef4444; color: white; }
