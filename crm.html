<head>

        (function() { emailjs.init("wLfY3tCPBLZBuNMkx"); })();

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script>
        const activeUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!activeUser) { window.location.replace('crm-login.html'); }

    <meta charset="UTF-8">
    <title>CureAndCare CRM - Live Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #00a2ed; --primary-dark: #008ecc; --bg: #f8fafc; --border: #e2e8f0; --text-main: #1e293b; --text-light: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }

        .sidebar { width: 260px; background: #ffffff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; }
        .logo-area { padding: 20px; border-bottom: 1px solid var(--border); }
        .logo-area h2 { color: var(--primary); font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .nav-menu { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-light); font-weight: 600; font-size: 13px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 5px; text-decoration: none; }
        .nav-item:hover { background: #f1f5f9; color: var(--text-main); }
        .nav-item.active { background: rgba(0,162,237,0.1); color: var(--primary); border-left: 4px solid var(--primary); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { height: 65px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; flex-shrink: 0; }
        .page-title { font-size: 18px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        
        .cloud-badge { font-size: 11px; background: #d1fae5; color: #059669; padding: 4px 8px; border-radius: 5px; border: 1px solid #10b981; }

        .live-clocks { display: flex; gap: 12px; }
        .clock-badge { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #334155; display: flex; align-items: center; gap: 5px; }
        .clock-badge span { color: var(--primary-dark); font-weight: 800; font-variant-numeric: tabular-nums; }

        .user-profile { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 13px; color: var(--text-main); }

        .roster-view { padding: 20px; overflow-y: auto; flex: 1; }
        .toolbar { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
        .select-input { padding: 9px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; outline: none; }
        
        .excel-table { width: 100%; border-collapse: collapse; min-width: 1200px; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .excel-table th { background: var(--primary); color: white; padding: 14px 10px; border: 1px solid var(--primary-dark); font-size: 11px; position: sticky; top: 0; z-index: 10; min-width: 170px; }
        .excel-table td { border: 1px solid #e2e8f0; vertical-align: top; padding: 12px 10px; }
        
        .t-label { font-size: 9px; color: #94a3b8; font-weight: 800; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
        .time-flex { display: flex; gap: 6px; margin-bottom: 8px; }
        .t-hr, .t-hr2 { flex: 2; padding: 6px 4px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 600; outline: none; background: #fff; }
        .t-ampm, .t-ampm2 { flex: 1; padding: 6px 2px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 700; background: #f8fafc; text-align: center; }
        
        .divider { border-top: 1px dashed #cbd5e1; margin: 8px 0; }
        
        .staff-select, .task-select { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 11px; font-weight: 700; outline: none; cursor: pointer; margin-bottom: 8px; }
        .staff-select { background: #f0f9ff; color: #008ecc; border-color: #00a2ed; }
        .task-select { background: #fff; color: #475569; }

        .btn { padding: 9px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .btn-save { background: #6366f1; color: white; }
        .btn-excel { background: #3b82f6; color: white; }
        .btn-publish { background: #10b981; color: white; }

        .staff-view-only select { pointer-events: none; background-color: #f8fafc !important; color: #64748b !important; border-color: #e2e8f0 !important; -moz-appearance: none; -webkit-appearance: none; appearance: none; }

        .crm-footer { background: #fff; padding: 12px 20px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-light); border-top: 1px solid var(--border); flex-shrink: 0; }
        .crm-footer span { color: var(--primary); }
    </style>
</head>
<body>

        <div class="logo-area"><h2><i class="fas fa-heartbeat"></i> CureAndCare</h2></div>
        <div class="nav-menu">
            <a href="crm-home.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
            
            <a href="crm-chat.html" class="nav-item" style="color: #00a2ed; font-weight: 800; background: #e0f2fe; border: 1px solid #7dd3fc; margin: 10px 5px;">
                <i class="fas fa-comments"></i> Team Chat 
                <span style="background:#ef4444; color:#fff; font-size:9px; padding:2px 5px; border-radius:10px; margin-left:auto;">LIVE</span>
            </a>

            <div id="adminMenus">
                <a class="nav-item"><i class="fas fa-wallet"></i> Funding</a>
                <a href="crm-invoice.html" class="nav-item"><i class="fas fa-file-invoice-dollar"></i> Invoice & claims</a>

            <a class="nav-item active"><i class="fas fa-calendar-alt"></i> Time & Attendance (Roster)</a>

        </div>

    <div class="main-content">
        <header class="top-header">
            <div class="page-title">Shift Roster Management <span class="cloud-badge"><i class="fas fa-cloud"></i> Cloud Synced</span></div>

            <div class="live-clocks">
                <div class="clock-badge">🇮🇳 IND: <span id="timeIND">--:--:--</span></div>
                <div class="clock-badge">🇦🇺 AUS: <span id="timeAUS">--:--:--</span></div>
            </div>

            <div class="user-profile">
                <i class="fas fa-user-circle" style="font-size:18px; color:var(--primary);"></i> 
                Hi, <span id="displayStaffName">Staff</span>
                <button onclick="localStorage.clear(); window.location.replace('crm-login.html');" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:700; font-size:11px; margin-left:10px;">Logout</button>
            </div>
        </header>

        <div class="roster-view">
            <div class="toolbar">
                <div style="display:flex; gap:15px; align-items:center;">
                    <select id="locationSelect" class="select-input" onchange="buildGrid()" style="width:320px;">
                        <option>27 Clearview Crescent Orange NSW 2800</option>
                        <option>27A Clearview Crescent Orange NSW 2800</option>
                        <option>7 Gilroy Place Orange NSW 2800</option>
                    </select>
                    <input type="date" id="rosterStartDate" value="2026-05-11" onchange="buildGrid()" class="select-input">
                </div>
                
                <div id="actionButtons" style="display:flex; gap:10px;">
                    <button class="btn btn-save" id="saveBtn" onclick="saveRoster()"><i class="fas fa-save"></i> Save Roster</button>
                    <button class="btn btn-excel" id="excelBtn" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
                    <button class="btn btn-publish" id="publishBtn" onclick="sendRosterEmail()"><i class="fas fa-paper-plane"></i> Publish & Email</button>
                </div>
            </div>

            <table class="excel-table">
                <thead id="rosterHeader"></thead>
                <tbody id="rosterGrid"></tbody>
            </table>
        </div>

            Copyright © 2026 cure and care | Designed by <span>skywebsolutions.in</span>
        </footer>

    <script>
        // 🚀 UI & ROLE CHECK
        let currentRole = 'staff'; 
        if(activeUser) {
            document.getElementById('displayStaffName').innerText = activeUser.name || activeUser.username;
            currentRole = String(activeUser.role || '').toLowerCase().trim();
            
            if (currentRole === 'staff') {
                document.getElementById('adminMenus').style.display = 'none';
                document.getElementById('adminMenus2').style.display = 'none';
                document.getElementById('actionButtons').style.display = 'none'; 
                
                if(document.getElementById('saveBtn')) document.getElementById('saveBtn').style.display = 'none';
                if(document.getElementById('excelBtn')) document.getElementById('excelBtn').style.display = 'none';
                if(document.getElementById('publishBtn')) document.getElementById('publishBtn').style.display = 'none';
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyC-Ito4dNRQ45IjIOWL63Hqk9sKzbvKe-M",
            authDomain: "cureandcare-crm.firebaseapp.com",
            databaseURL: "https://cureandcare-crm-default-rtdb.firebaseio.com",
            projectId: "cureandcare-crm",
            storageBucket: "cureandcare-crm.firebasestorage.app",
            messagingSenderId: "294207622967",
            appId: "1:294207622967:web:59846c2cf1b463cb21d4b2"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const SERVICE_ID = "service_adqy43h";
        const TEMPLATE_ID = "template_gb0v9d9"; 
        const TEST_EMAILS = ["puja851021@gmail.com", "starunsharma67@gmail.com", "starun64@gmail.com", "ayushsydney@gmail.com", "sharma.meenu84@gmail.com"];
        
        const STAFF_LIST = ["None", "Ankit", "Bubble", "Rene", "Titus", "Marcelo", "Nitesh"];
        const TASK_LIST = ["Select Task", "1:1 Support", "Community Participation", "Sleepover", "Awake Night"];
        const HR_OPTIONS = ["Select", "12:00", "01:00", "02:00", "03:00", "04:00", "05:00", "06:00", "07:00", "08:00", "09:00", "10:00", "11:00", "Sleepover", "Leave", "Sick", "Training"];

        function updateLiveClocks() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('timeIND').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'Asia/Kolkata' }).format(now);
            document.getElementById('timeAUS').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'Australia/Sydney' }).format(now);
        }
        setInterval(updateLiveClocks, 1000);

        function buildGrid() {
            const loc = document.getElementById('locationSelect').value;
            const start = new Date(document.getElementById('rosterStartDate').value);
            const grid = document.getElementById('rosterGrid');
            const header = document.getElementById('rosterHeader');

            let columns = [];
            if(loc.includes("27A")) {
                columns = ["Shift 1", "Shift 2", "Craig Calleja (Home Support)"];
            } else {
                columns = ["Shift 1", "Shift 2", "Shift 3", "Mitch (1:1)", "Steve's Home alone hours"];
            }

            header.innerHTML = `<tr><th width="120">Date / Day</th>${columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
            grid.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:40px; font-weight:bold; color:#00a2ed;"><i class="fas fa-spinner fa-spin"></i> Fetching Live Roster from Cloud...</td></tr>';

            const uniqueKey = "Roster_" + loc.replace(/[.#$\[\] ]/g, '_') + "_" + document.getElementById('rosterStartDate').value;

            const disabledClass = currentRole === 'staff' ? 'staff-view-only' : '';

            database.ref('rosters/' + uniqueKey).get().then((snapshot) => {
                let savedData = [];
                if (snapshot.exists()) {
                    savedData = snapshot.val();
                }
                
                grid.innerHTML = '';
                
                for(let i=0; i<14; i++) {
                    let d = new Date(start); d.setDate(start.getDate() + i);
                    let row = `<tr class="${disabledClass}">
                        <td style="background:#f8fafc; text-align:center; vertical-align:middle;">
                            <b style="font-size:14px; color:#1e293b;">${d.getDate()}-${d.toLocaleString('default',{month:'short'})}</b><br>
                            <span style="color:#64748b; font-weight:600;">${d.toLocaleDateString('en-US',{weekday:'long'})}</span>
                        </td>
                        ${columns.map((val, cellIndex) => {
                            let s = savedData && savedData[i] && savedData[i][cellIndex] ? savedData[i][cellIndex] : {};
                            
                            let currentTasks = [...TASK_LIST];
                            if (val === "Shift 3" || val === "Mitch (1:1)") {
                                currentTasks.push("Specialist Appointment");
                            }

                            return `<td>
                                <div class="t-label">Start Time</div>
                                <div class="time-flex"><select class="t-hr">${HR_OPTIONS.map(h => `<option ${h === (s.hr1 || 'Select') ? 'selected' : ''}>${h}</option>`).join('')}</select>
                                <select class="t-ampm"><option ${s.ampm1 === 'AM' ? 'selected' : ''}>AM</option><option ${s.ampm1 === 'PM' ? 'selected' : ''}>PM</option></select></div>
                                <div class="t-label">End Time</div>
                                <div class="time-flex"><select class="t-hr2">${HR_OPTIONS.map(h => `<option ${h === (s.hr2 || 'Select') ? 'selected' : ''}>${h}</option>`).join('')}</select>
                                <select class="t-ampm2"><option ${s.ampm2 === 'AM' ? 'selected' : ''}>AM</option><option ${s.ampm2 === 'PM' ? 'selected' : ''}>PM</option></select></div>
                                <div class="divider"></div>
                                <div class="t-label">Assign Staff</div>
                                <select class="staff-select">${STAFF_LIST.map(n => `<option ${n === (s.staff || 'None') ? 'selected' : ''}>${n}</option>`).join('')}</select>
                                <div class="t-label">Assign Task</div>
                                <select class="task-select">${currentTasks.map(t => `<option ${t === (s.task || 'Select Task') ? 'selected' : ''}>${t}</option>`).join('')}</select>
                            </td>`;
                        }).join('')}
                    </tr>`;
                    grid.innerHTML += row;
                }
            }).catch((error) => {
                grid.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 40px; color: red;"><b>Database Error:</b> Ensure Firebase Realtime Database 'Rules' are set to test mode (true).</td></tr>`;
                console.error(error);
            });
        }

        // 🚀 10-HOUR WARNING LOGIC FOR ROSTER GRID
        document.getElementById('rosterGrid').addEventListener('change', function(e) {
            if (e.target.classList.contains('t-hr') || e.target.classList.contains('t-ampm') || 
                e.target.classList.contains('t-hr2') || e.target.classList.contains('t-ampm2')) {
                
                let td = e.target.closest('td');
                let hr1 = td.querySelector('.t-hr').value;
                let ampm1 = td.querySelector('.t-ampm').value;
                let hr2 = td.querySelector('.t-hr2').value;
                let ampm2 = td.querySelector('.t-ampm2').value;

                if (hr1 !== 'Select' && hr2 !== 'Select' && hr1.includes(':') && hr2.includes(':')) {
                    let parseTime = (timeStr, ampm) => {
                        let [h, m] = timeStr.split(':').map(Number);
                        if (ampm === 'PM' && h !== 12) h += 12;
                        if (ampm === 'AM' && h === 12) h = 0;
                        return h + (m / 60);
                    };

                    let t1 = parseTime(hr1, ampm1);
                    let t2 = parseTime(hr2, ampm2);
                    let diff = t2 - t1;

                    if (diff < 0) diff += 24; // Overnight shift logic

                    if (diff > 10) {
                        alert(`⚠️ STRICT WARNING!\n\nThis shift is ${diff.toFixed(1)} hours long, which exceeds the 10-hour limit.\nPlease verify before saving.`);
                    }
                }
            }
        });

        function saveRoster() {
            if (currentRole === 'staff') return; 

            const btn = document.getElementById('saveBtn');
            const loc = document.getElementById('locationSelect').value;
            const date = document.getElementById('rosterStartDate').value;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving to Cloud...';
            btn.disabled = true;

            let data = [];
            document.querySelectorAll('#rosterGrid tr').forEach(row => {
                let rowData = [];
                row.querySelectorAll('td').forEach((td, idx) => { 
                    if(idx > 0) {
                        rowData.push({ 
                            hr1: td.querySelector('.t-hr').value, ampm1: td.querySelector('.t-ampm').value,
                            hr2: td.querySelector('.t-hr2').value, ampm2: td.querySelector('.t-ampm2').value,
                            staff: td.querySelector('.staff-select').value,
                            task: td.querySelector('.task-select').value 
                        });
                    }
                });
                data.push(rowData);
            });

            const uniqueKey = "Roster_" + loc.replace(/[.#$\[\] ]/g, '_') + "_" + date;

            database.ref('rosters/' + uniqueKey).set(data)
            .then(() => {
                alert("Roster successfully saved to Cloud Database! ☁️✅");
            })
            .catch((error) => {
                alert("Save Failed! Please check Firebase rules or internet connection.");
                console.error(error);
            })
            .finally(() => {
                btn.innerHTML = '<i class="fas fa-save"></i> Save Roster';
                btn.disabled = false;
            });
        }

        function exportToExcel() {
            if (currentRole === 'staff') return;

            const loc = document.getElementById('locationSelect').value;
            const headers = Array.from(document.querySelectorAll('#rosterHeader th')).map(th => th.innerText);
            let csv = `Location: ${loc}\n${headers.join(',')}\n`;
            document.querySelectorAll('#rosterGrid tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                let r = [`"${cells[0].innerText.replace(/\n/g,' ')}"`];
                for(let i=1; i<cells.length; i++) {
                    let td = cells[i];
                    let hr1 = td.querySelector('.t-hr').value, ampm1 = td.querySelector('.t-ampm').value;
                    let hr2 = td.querySelector('.t-hr2').value, ampm2 = td.querySelector('.t-ampm2').value;
                    let s = td.querySelector('.staff-select').value, tsk = td.querySelector('.task-select').value;
                    
                    if(s !== "None") {
                        let t = "";
                        if (hr1 !== "Select" && hr2 !== "Select") t = `${hr1} ${ampm1} - ${hr2} ${ampm2}`;
                        else if (hr1 !== "Select") t = `${hr1} ${ampm1}`;
                        
                        let parts = [s];
                        if (tsk !== "Select Task") parts.push(tsk);
                        if (t !== "") parts.push(`(${t})`);
                        r.push(`"${parts.join(' ')}"`);
                    } else r.push(`"-"`);
                }
                csv += r.join(',') + "\n";
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Roster.csv`; a.click();
        }

        async function sendRosterEmail() {
            if (currentRole === 'staff') return;

            const btn = document.querySelector('.btn-publish');
            const loc = document.getElementById('locationSelect').value;
            const headers = Array.from(document.querySelectorAll('#rosterHeader th')).map(th => th.innerText);
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing...'; 
            btn.disabled = true;

            let tableHtml = `
            <div style="overflow-x: auto; max-width: 100%; margin: 0 auto;">
                <table style="width:100%; min-width: 650px; border-collapse:collapse; font-size:13px; font-family: Arial, sans-serif; border:1px solid #ddd;">
                    <tr style="background:#00a2ed; color:white;">
                        ${headers.map(h => `<th style="padding:10px; border:1px solid #008ecc; white-space: nowrap;">${h}</th>`).join('')}
                    </tr>`;

            document.querySelectorAll('#rosterGrid tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                let rData = `<tr><td style="padding:10px; border:1px solid #ddd; background:#f9f9f9; vertical-align:middle; white-space:nowrap;">${cells[0].innerText.replace(/\n/g, '<br>')}</td>`;
                let hasEntry = false;

                for(let i=1; i<cells.length; i++) {
                    let td = cells[i];
                    let hr1 = td.querySelector('.t-hr').value, ampm1 = td.querySelector('.t-ampm').value;
                    let hr2 = td.querySelector('.t-hr2').value, ampm2 = td.querySelector('.t-ampm2').value;
                    let s = td.querySelector('.staff-select').value, tsk = td.querySelector('.task-select').value;
                    
                    if(s !== "None") {
                        let timeParts = [];
                        if (hr1 && hr1 !== "Select") timeParts.push(`${hr1} ${ampm1}`);
                        if (hr2 && hr2 !== "Select") timeParts.push(`${hr2} ${ampm2}`);
                        let t = timeParts.join(' - ');

                        let taskHtml = (!tsk || tsk === "Select Task") ? "" : `<div style="font-size:11px; margin-top:4px; color:#475569;">${tsk}</div>`;
                        let timeHtml = (t === "") ? "" : `<div style="color:#00a2ed; font-weight:bold; font-size:11px; margin-top:4px;">${t}</div>`;
                        
                        rData += `<td style="padding:10px; border:1px solid #ddd; text-align:center; vertical-align:middle;">
                                    <strong style="font-size:13px; color:#1e293b;">${s}</strong>
                                    ${taskHtml}
                                    ${timeHtml}
                                  </td>`;
                        hasEntry = true;
                    } else {
                        rData += `<td style="padding:10px; border:1px solid #ddd; color:#cbd5e1; text-align:center; vertical-align:middle;">-</td>`;
                    }
                }
                if(hasEntry) tableHtml += rData + `</tr>`;
            });
            tableHtml += `</table></div>`;

            try {
                for (let i = 0; i < TEST_EMAILS.length; i++) {
                    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending (${i + 1}/${TEST_EMAILS.length})...`;
                    await emailjs.send(SERVICE_ID, TEMPLATE_ID, { 
                        to_email: TEST_EMAILS[i], 
                        message: "New Roster for " + loc, 
                        roster_table: tableHtml 
                    });
                    
                    if (i < TEST_EMAILS.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, 4000));
                    }
                }
                alert('SUCCESS! Mails sent to all addresses 🚀'); 
            } catch (err) {
                alert('Error: ' + (err.text || 'Email failed.')); 
            } finally {
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish & Email'; 
                btn.disabled = false; 
            }
        }

        window.onload = function() {
            buildGrid();
            updateLiveClocks();
        };
    </script>
</body>
</html>
